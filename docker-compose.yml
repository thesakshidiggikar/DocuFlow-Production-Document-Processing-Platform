services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docuflow
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: docuflow
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuflow -d docuflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done; mc mb -p local/docuflow || true"
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.8
    ports: ["9324:9324"]
    volumes: ["./infra/elasticmq.conf:/opt/elasticmq.conf"]
  api:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      elasticmq: {condition: service_started}
    ports: ["8000:8000"]
  worker:
    build: ./worker
    env_file: .env
    depends_on: [api, minio-init, elasticmq]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]
